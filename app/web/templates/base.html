<!DOCTYPE html>
<html lang="en">

<head>
    {% block head %}
    <link rel="stylesheet" href="libs/milligram.min.css"
        integrity="sha512-xiunq9hpKsIcz42zt0o2vCo34xV0j6Ny8hgEylN3XBglZDtTZ2nwnqF/Z/TTCc18sGdvCjbFInNd++6q3J0N6g=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <title>{% block title %}{% endblock %}</title>
    <style>
        .container {
            margin-top: 2rem;
        }

        h1 {
            border-bottom: 1px solid gray;
        }

        .user-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .user-badge {
            font-size: 0.8rem;
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
            background: #eee;
            color: #666;
        }

        .user-badge.admin {
            background: #dbeafe;
            color: #1e40af;
        }
    </style>
    {% endblock %}
</head>

<body class="container">
    {% if user_username %}
    <div class="user-bar">
        <span>{{user_username}}</span>
        <span class="user-badge {% if user_is_admin %}admin{% endif %}">{{user_group}}</span>
        <a href="/auth/logout">Logout</a>
    </div>
    {% endif %}
    <a href=".">
        <h1>{{app_title}}</h1>
    </a>
    <main>{% block content %}{% endblock %}</main>
</body>

</html>
