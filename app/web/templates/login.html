{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block head %}
{{ super() }}
<style type="text/css">
    .login-container {
        max-width: 400px;
        margin: 4rem auto;
        border: 1px solid #ccc;
        padding: 2rem;
    }
    .error {
        color: #dc2626;
        margin-bottom: 1rem;
    }
</style>
{% endblock %}
{% block content %}
<div class="login-container">
    <h2>Login</h2>
    {% if error %}
    <p class="error">{{error}}</p>
    {% endif %}
    <form method="post" action="/auth/login">
        <input type="hidden" name="next_url" value="{{next|default('')}}">
        <label>
            Username
            <input type="text" name="username" required autofocus>
        </label>
        <label>
            Password
            <input type="password" name="password" required>
        </label>
        <button type="submit">Login</button>
    </form>
</div>
{% endblock %}
